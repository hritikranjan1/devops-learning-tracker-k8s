apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: devtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: hritikranjan1/devops-learning-tracker-nginx:1.0
          imagePullPolicy: IfNotPresent                               # 👈 YAHAN
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
            requests:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5